[project]
name = "food-classification-mlops"
version = "0.1.0"
description = "Production ML pipeline for food classification"
authors = [
    {name = "Tanmay Naik",email = "tanmaynaik99811@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "wandb (>=0.24.0,<0.25.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
